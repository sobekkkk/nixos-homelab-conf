services:
  caddy:
    # Digest du manifeste multi-architecture vérifié le 2026-09-29.
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      - uptime-kuma
    ports:
      # 443 sur l'adresse Tailscale est réservé à Tailscale Serve (Portainer).
      - "192.168.1.69:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
        mode: 0444
    networks:
      - homelab-proxy
      - kuma
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  uptime-kuma:
    # Digest du manifeste multi-architecture vérifié le 2026-09-29.
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - kuma
    security_opt:
      - no-new-privileges:true

networks:
  homelab-proxy:
    external: true
  kuma:
    internal: true
    name: uptime-kuma-net

volumes:
  caddy_data:
    name: uptime-kuma-caddy-data
  caddy_config:
    name: uptime-kuma-caddy-config
  uptime_kuma_data:
    name: uptime-kuma-data

configs:
  caddyfile:
    content: |
      {
        admin off
      }

      portainer.home.arpa {
        tls internal
        reverse_proxy https://portainer:9443 {
          transport http {
            tls_insecure_skip_verify
          }
        }
      }

      status.home.arpa {
        tls internal
        reverse_proxy uptime-kuma:3001
      }
